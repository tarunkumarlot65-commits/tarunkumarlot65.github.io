<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GlobeTalk - Video chat with random people worldwide. Instant translation in 18 languages.">
    <meta name="keywords" content="video chat, random chat, omegle alternative, global friends, translation">
    <title>GlobeTalk - Chat with the World</title>
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            width: 95%;
            max-width: 1200px;
            height: 95vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .language-select {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
        }
        
        .video-box {
            flex: 1;
            background: #000;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .sidebar {
            width: 300px;
            background: white;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            text-align: right;
            margin-left: 30px;
        }
        
        .message.other {
            background: #e9ecef;
            color: #333;
            margin-right: 30px;
        }
        
        .chat-input {
            padding: 15px;
            display: flex;
            gap: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            flex-wrap: wrap;
        }
        
        .controls button {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            font-size: 14px;
        }
        
        .status {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ddd;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .modal-content button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 GlobeTalk</h1>
            <select class="language-select" id="languageSelect">
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
            </select>
        </div>

        <div class="main">
            <div class="video-container">
                <div class="video-box">
                    <video id="remoteVideo" autoplay></video>
                    <div style="color: white;" id="remotePlaceholder">Waiting for connection...</div>
                </div>
                <div class="video-box">
                    <video id="localVideo" autoplay muted></video>
                    <div style="color: white;" id="localPlaceholder">Camera preview</div>
                </div>
            </div>

            <div class="sidebar">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type message..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
                <div class="status" id="status">Disconnected</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startCall()">🎬 Start Chat</button>
            <button onclick="nextPerson()">⏭️ Next</button>
            <button onclick="toggleAudio()">🔊 Mute</button>
            <button onclick="toggleVideo()">📹 Stop</button>
            <button onclick="endCall()">❌ End</button>
        </div>
    </div>

    <div class="modal active" id="ageGateModal">
        <div class="modal-content">
            <h2>🔒 Age Verification</h2>
            <p style="margin-bottom: 20px; color: #666;">You must be 18+ to use GlobeTalk</p>
            <input type="date" id="dobInput" />
            <button onclick="verifyAge()">Verify Age</button>
        </div>
    </div>

    <div class="modal" id="emailModal">
        <div class="modal-content">
            <h2>📧 Email Verification</h2>
            <input type="email" id="emailInput" placeholder="your@email.com" />
            <button onclick="sendOTP()">Send OTP</button>
            <div id="otpSection" style="display: none; margin-top: 15px;">
                <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" />
                <button onclick="verifyOTP()">Verify OTP</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = { id: null, email: null, language: 'en', verified: false };
        let callState = { isActive: false, audioEnabled: true, videoEnabled: true };

        function verifyAge() {
            const dob = new Date(document.getElementById('dobInput').value);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const monthDiff = today.getMonth() - dob.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) age--;

            if (age < 18) {
                alert('You must be 18+');
                return;
            }
            document.getElementById('ageGateModal').classList.remove('active');
            document.getElementById('emailModal').classList.add('active');
        }

        async function sendOTP() {
            const email = document.getElementById('emailInput').value;
            if (!email.includes('@')) return alert('Valid email required');

            try {
                const response = await fetch('https://globetalk-server-cpnw.onrender.com/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (response.ok) {
                    document.getElementById('otpSection').style.display = 'block';
                    alert('OTP sent!');
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('emailInput').value;
            const otp = document.getElementById('otpInput').value;

            try {
                const response = await fetch('https://globetalk-server-cpnw.onrender.com/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                if (response.ok) {
                    const data = await response.json();
                    currentUser.email = email;
                    currentUser.id = data.userId;
                    currentUser.verified = true;
                    document.getElementById('emailModal').classList.remove('active');
                    updateStatus('Ready to chat!');
                } else {
                    alert('Invalid OTP');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        document.getElementById('languageSelect').addEventListener('change', (e) => {
            currentUser.language = e.target.value;
        });

        function updateStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        async function startCall() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = stream;
                document.getElementById('localPlaceholder').style.display = 'none';
                callState.isActive = true;
                updateStatus('Connected ✅');
            } catch (error) {
                alert('Camera/Mic permission required');
            }
        }

        function toggleAudio() {
            const stream = document.getElementById('localVideo').srcObject;
            if (stream) stream.getAudioTracks().forEach(t => t.enabled = !t.enabled);
        }

        function toggleVideo() {
            const stream = document.getElementById('localVideo').srcObject;
            if (stream) stream.getVideoTracks().forEach(t => t.enabled = !t.enabled);
        }

        function endCall() {
            const stream = document.getElementById('localVideo').srcObject;
            if (stream) stream.getTracks().forEach(t => t.stop());
            callState.isActive = false;
            updateStatus('Call ended');
        }

        function nextPerson() {
            alert('Connecting to next person...');
        }

        function addMessage(text, sender = 'user') {
            const el = document.createElement('div');
            el.className = 'message ' + sender;
            el.textContent = text;
            document.getElementById('chatMessages').appendChild(el);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            setTimeout(() => addMessage('That\'s interesting!', 'other'), 500);
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
